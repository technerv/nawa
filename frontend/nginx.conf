server {
  listen 80;
  server_name _;

  # Frontend static
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # API proxy
  location /api/ {
    proxy_pass http://web:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Serve backend static files directly (collected into staticfiles)
  location /static/ {
    alias /var/www/nawa/staticfiles/;
    access_log off;
    expires 7d;
  }

  # Serve backend media files directly
  location /media/ {
    alias /var/www/nawa/media/;
    access_log off;
    expires 1d;
  }
}

